<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Gallery | Banaras Hospital</title>

    <meta name="description" content="Explore the Banaras Hospital infrastructure, facilities and care environment.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <header class="gallery-header">

            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

    </footer>

    <!-- Lightbox viewer -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
        <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>
        <div class="lightbox-inner"><img id="lightbox-img" src="" alt="Enlarged gallery photo"></div>
        <button class="lightbox-next" id="lightbox-next" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
        <span class="lightbox-counter" id="lightbox-counter"></span>
    </div>

    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
